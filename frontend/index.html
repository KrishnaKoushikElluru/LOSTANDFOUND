<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔍 LostNFound - AI-Powered Lost & Found System</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- AOS Animation Library -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

  <!-- Particles.js for background effects -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>

<body>
  <!-- Animated Background -->
  <div class="animated-bg"></div>
  <div class="grid-pattern"></div>

  <!-- Particles Background -->
  <div id="particles-js" style="position: fixed; width: 100%; height: 100%; z-index: 0;"></div>

  <!-- Theme Toggle Button -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme" title="Toggle Light/Dark Mode">
    <i class="fas fa-sun" id="themeIcon"></i>
  </button>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">

      <!-- Header -->
      <div class="header-container" data-aos="fade-down">
        <div class="logo-icon">🔍</div>
        <h1 class="main-title">LostNFound</h1>
        <p class="subtitle">AI-Powered Lost & Found System with Visual Search</p>
        <div class="status-badge">
          <div class="status-dot" id="statusDot"></div>
          <span>Backend Status: <span id="backendStatus">Checking...</span></span>
        </div>
      </div>

      <!-- Search Section -->
      <div class="glass-panel" style="padding: 2.5rem; margin-bottom: 2rem;" data-aos="fade-up" data-aos-delay="100">
        <div class="section-header">
          <span class="section-icon">🔎</span>
          <h2 class="section-title">Search for Your Item</h2>
        </div>

        <div class="search-grid">
          <!-- Text Search -->
          <div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
              <i class="fas fa-comment-dots" style="font-size: 1.5rem; color: var(--accent-blue);"></i>
              <h3 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary);">Search by Description</h3>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <input id="textQuery" type="text" class="form-input"
                placeholder="e.g., black leather wallet, blue iPhone 13, red backpack..." />
              <button id="btnTextSearch" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-search"></i> SEARCH WITH TEXT
              </button>
            </div>
          </div>

          <!-- Image Search -->
          <div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
              <i class="fas fa-camera" style="font-size: 1.5rem; color: var(--accent-purple);"></i>
              <h3 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary);">Search by Image</h3>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <label class="file-upload-area" id="searchUploadArea">
                <input id="imageFileSearch" type="file" accept="image/*" style="display: none;" />
                <div class="upload-icon">📸</div>
                <p style="color: var(--text-secondary); font-weight: 600; margin: 0;" id="searchFileName">
                  Click or drag image here
                </p>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0.5rem 0 0 0;">
                  JPG, PNG, or GIF
                </p>
              </label>
              <button id="btnImageSearch" class="btn btn-purple" style="width: 100%;">
                <i class="fas fa-image"></i> SEARCH WITH IMAGE
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Upload & Index Section -->
      <div class="glass-panel" style="padding: 2.5rem; margin-bottom: 2rem;" data-aos="fade-up" data-aos-delay="200">
        <div class="section-header">
          <span class="section-icon">📦</span>
          <h2 class="section-title">Report Lost or Found Item</h2>
        </div>

        <form id="indexForm">
          <!-- Status and Item Name -->
          <div class="grid-2" style="margin-bottom: 1.5rem;">
            <div>
              <label class="form-label">
                <i class="fas fa-clipboard-list"></i> STATUS *
              </label>
              <select id="status" class="form-select">
                <option value="found">✅ Found Item</option>
                <option value="lost">❌ Lost Item</option>
              </select>
            </div>

            <div>
              <label class="form-label">
                <i class="fas fa-tag"></i> ITEM NAME *
              </label>
              <input id="itemName" type="text" class="form-input" placeholder="e.g., Wallet, Keys, Phone" />
            </div>
          </div>

          <!-- Location, Name, Email -->
          <div class="grid-3" style="margin-bottom: 1.5rem;">
            <div>
              <label class="form-label">
                <i class="fas fa-map-marker-alt"></i> LOCATION
              </label>
              <input id="location" type="text" class="form-input" placeholder="e.g., Cafeteria, Library" />
            </div>

            <div>
              <label class="form-label">
                <i class="fas fa-user"></i> YOUR NAME
              </label>
              <input id="ownerName" type="text" class="form-input" placeholder="Full Name" />
            </div>

            <div>
              <label class="form-label">
                <i class="fas fa-envelope"></i> EMAIL
              </label>
              <input id="ownerEmail" type="email" class="form-input" placeholder="your@email.com" />
            </div>
          </div>

          <!-- Description -->
          <div style="margin-bottom: 1.5rem;">
            <label class="form-label">
              <i class="fas fa-align-left"></i> DESCRIPTION (OPTIONAL)
            </label>
            <textarea id="description" class="form-textarea"
              placeholder="Add any additional details about the item..."></textarea>
          </div>

          <!-- File Upload -->
          <div style="margin-bottom: 1.5rem;">
            <label class="form-label">
              <i class="fas fa-camera"></i> UPLOAD IMAGE *
            </label>
            <label class="file-upload-area" id="uploadArea">
              <input id="imageFile" type="file" accept="image/*" style="display: none;" />
              <div class="upload-icon">📷</div>
              <p style="color: var(--text-secondary); font-weight: 600; margin: 0;" id="uploadFileName">
                Click or drag photo here
              </p>
              <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0.5rem 0 0 0;">
                JPG, PNG, or GIF (Max 10MB)
              </p>
            </label>
          </div>

          <!-- Submit Button -->
          <button id="btnIndex" type="button" class="btn btn-success"
            style="width: 100%; padding: 1.25rem; font-size: 1.05rem;">
            <i class="fas fa-rocket"></i> UPLOAD & INDEX ITEM
          </button>

          <p style="text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem;">
            <i class="fas fa-magic"></i> Your item will be indexed using AI for smart visual search
          </p>
        </form>
      </div>

      <!-- Results Section -->
      <div id="resultsSection" style="display: none;">
        <div class="glass-panel" style="padding: 2.5rem;" data-aos="fade-up">
          <div class="section-header">
            <span class="section-icon">✨</span>
            <h2 class="section-title">Search Results</h2>
          </div>
          <div id="results" class="results-grid"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingIndicator" class="loading-overlay" style="display: none;">
    <div class="loading-content">
      <div class="spinner"></div>
      <p class="loading-text">Processing...</p>
      <p style="color: var(--text-secondary); margin-top: 0.5rem;">Please wait</p>
    </div>
  </div>

  <!-- AOS Animation Library -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- Main JavaScript -->
  <script src="script.js"></script>

  <script>
    // Initialize AOS animations
    AOS.init({
      duration: 800,
      once: true,
      offset: 100
    });

    // Initialize Particles.js
    particlesJS('particles-js', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: ['#00d4ff', '#a855f7', '#10b981'] },
        shape: { type: 'circle' },
        opacity: {
          value: 0.3,
          random: true,
          anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false }
        },
        size: {
          value: 3,
          random: true,
          anim: { enable: true, speed: 2, size_min: 0.1, sync: false }
        },
        line_linked: {
          enable: true,
          distance: 150,
          color: '#00d4ff',
          opacity: 0.2,
          width: 1
        },
        move: {
          enable: true,
          speed: 1,
          direction: 'none',
          random: true,
          straight: false,
          out_mode: 'out',
          bounce: false
        }
      },
      interactivity: {
        detect_on: 'canvas',
        events: {
          onhover: { enable: true, mode: 'grab' },
          onclick: { enable: true, mode: 'push' },
          resize: true
        },
        modes: {
          grab: { distance: 140, line_linked: { opacity: 0.5 } },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>
</body>

</html>
